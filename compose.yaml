services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./modelos
        target: /app/modelos
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
